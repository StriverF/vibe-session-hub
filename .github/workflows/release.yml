name: Release macOS DMG

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.0.0 or v1.1.0-rc.1)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Tests & Static Checks
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Python compile & unittest suite
        run: |
          /usr/bin/python3 -m py_compile hub/*.py hub/collectors/*.py scripts/*.py tests/*.py
          /usr/bin/python3 -m unittest discover -s tests -v

      - name: Verify frontend JS & shell scripts
        run: |
          for f in static/js/*.js; do
            node --check "$f"
          done
          bash -n install.sh scripts/package_macos.sh

  build-and-release:
    name: Build Universal DMG & Publish Release
    needs: verify
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag and semver
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="$INPUT_TAG"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          TAG="v${RAW_TAG#v}"
          VERSION="${TAG#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9._-]+)?$ ]]; then
            echo "Error: invalid semver tag '$TAG' (expected vX.Y.Z)" >&2
            exit 1
          fi

          IS_PRERELEASE="false"
          if [ "$INPUT_PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          DMG_NAME="Vibe-Session-Hub-v${VERSION}-macos-universal.dmg"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$IS_PRERELEASE"
            echo "dmg_name=$DMG_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "Release Tag : $TAG"
          echo "Version     : $VERSION"
          echo "Prerelease  : $IS_PRERELEASE"
          echo "DMG Asset   : $DMG_NAME"

      - name: Ensure tag exists for manual workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Checking out existing tag ${TAG}"
            git checkout "refs/tags/${TAG}"
          else
            echo "Creating and pushing tag ${TAG} at ${GITHUB_SHA}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Configure optional Apple Developer ID signing
        id: signing
        env:
          APPLE_SIGNING_CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_CERT_P12" ] || [ -n "$APPLE_SIGNING_IDENTITY" ] || [ -n "$APPLE_SIGNING_CERT_PASSWORD" ]; then
            if [ -z "$APPLE_SIGNING_CERT_P12" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
              echo "Error: partial Apple signing secrets detected. Set both APPLE_SIGNING_CERT_P12 and APPLE_SIGNING_IDENTITY (plus APPLE_SIGNING_CERT_PASSWORD if the .p12 is password-protected)." >&2
              exit 1
            fi

            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASS="$(uuidgen)"
            CERT_PATH="$RUNNER_TEMP/developer-id.p12"
            CLEAN_IDENTITY="$(printf '%s' "$APPLE_SIGNING_IDENTITY" | tr -d '\r\n')"

            printf '%s' "$APPLE_SIGNING_CERT_P12" | tr -d '\r\n ' | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$APPLE_SIGNING_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security default-keychain -d user -s "$KEYCHAIN_PATH"
            rm -f "$CERT_PATH"

            IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
            echo "$IDENTITIES"
            if ! printf '%s\n' "$IDENTITIES" | grep -Fiq "$CLEAN_IDENTITY"; then
              echo "Error: signing identity '$CLEAN_IDENTITY' was not found as a valid codesigning identity in the imported .p12." >&2
              exit 1
            fi

            echo "identity=$CLEAN_IDENTITY" >> "$GITHUB_OUTPUT"
            echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
            echo "developer_id=true" >> "$GITHUB_OUTPUT"
          else
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "keychain_path=" >> "$GITHUB_OUTPUT"
            echo "developer_id=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Universal macOS App & DMG installer
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          MACOS_KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          bash scripts/package_macos.sh \
            --version "$VERSION" \
            --arch universal \
            --output-dir dist

      - name: Optional Apple notarization for DMG
        id: notary
        if: steps.signing.outputs.developer_id == 'true'
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_NOTARY_APPLE_ID" ] || [ -n "$APPLE_NOTARY_PASSWORD" ] || [ -n "$APPLE_TEAM_ID" ]; then
            if [ -z "$APPLE_NOTARY_APPLE_ID" ] || [ -z "$APPLE_NOTARY_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "Error: partial Apple notarization secrets detected. Set APPLE_NOTARY_APPLE_ID, APPLE_NOTARY_PASSWORD, and APPLE_TEAM_ID together." >&2
              exit 1
            fi

            NOTARY_JSON="$RUNNER_TEMP/notary-result.json"
            set +e
            xcrun notarytool submit "dist/$DMG_NAME" \
              --apple-id "$APPLE_NOTARY_APPLE_ID" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json \
              --wait > "$NOTARY_JSON"
            SUBMIT_RC=$?
            set -e

            cat "$NOTARY_JSON"
            read -r SUBMISSION_ID SUBMISSION_STATUS < <(
              /usr/bin/python3 -c '
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception:
              print("- UNKNOWN")
              sys.exit(0)
          sid = str(data.get("id") or "-").strip() or "-"
          status = str(data.get("status") or "UNKNOWN").strip() or "UNKNOWN"
          print(f"{sid} {status}")
          ' "$NOTARY_JSON"
            )

            if [ "$SUBMIT_RC" -ne 0 ] || [ "$SUBMISSION_STATUS" != "Accepted" ]; then
              echo "Error: Apple notarization failed (exit=$SUBMIT_RC, status=$SUBMISSION_STATUS, id=$SUBMISSION_ID)" >&2
              if [ -n "$SUBMISSION_ID" ] && [ "$SUBMISSION_ID" != "-" ]; then
                echo "=== Apple Notary Log ($SUBMISSION_ID) ===" >&2
                xcrun notarytool log "$SUBMISSION_ID" \
                  --apple-id "$APPLE_NOTARY_APPLE_ID" \
                  --password "$APPLE_NOTARY_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" >&2 || true
              fi
              exit 1
            fi

            xcrun stapler staple "dist/$DMG_NAME"
            xcrun stapler validate "dist/$DMG_NAME"
            (cd dist && /usr/bin/shasum -a 256 "$DMG_NAME" > "${DMG_NAME}.sha256")
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify mounted DMG bundle and read-only runtime smoke test
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
          DEVELOPER_ID: ${{ steps.signing.outputs.developer_id }}
          NOTARIZED: ${{ steps.notary.outputs.notarized }}
        run: |
          MOUNT_DIR="$(mktemp -d)"
          TMP_STATE="$(mktemp -d)"
          SRV_PID=""
          cleanup() {
            if [ -n "$SRV_PID" ]; then
              kill "$SRV_PID" 2>/dev/null || true
            fi
            hdiutil detach "$MOUNT_DIR" -force >/dev/null 2>&1 || true
            rm -rf "$MOUNT_DIR" "$TMP_STATE"
          }
          trap cleanup EXIT

          hdiutil attach "dist/$DMG_NAME" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          APP="$MOUNT_DIR/Vibe Session Hub.app"
          test -d "$APP"
          test -L "$MOUNT_DIR/Applications"
          test "$(readlink "$MOUNT_DIR/Applications")" = "/Applications"

          PLIST_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          test "$PLIST_VER" = "$VERSION"
          /usr/libexec/PlistBuddy -c 'Print :NSAppleEventsUsageDescription' "$APP/Contents/Info.plist" >/dev/null

          lipo -info "$APP/Contents/MacOS/VibeSessionHub" | grep -q "arm64"
          lipo -info "$APP/Contents/MacOS/VibeSessionHub" | grep -q "x86_64"
          lipo -info "$APP/Contents/MacOS/send_url_to_pid" | grep -q "arm64"
          lipo -info "$APP/Contents/MacOS/send_url_to_pid" | grep -q "x86_64"

          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/send_url_to_pid"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q "com.apple.security.automation.apple-events"
          codesign -d --entitlements :- "$APP/Contents/MacOS/send_url_to_pid" 2>/dev/null | grep -q "com.apple.security.automation.apple-events"

          if [ "$DEVELOPER_ID" = "true" ]; then
            codesign --verify --verbose=2 "dist/$DMG_NAME"
            codesign -dv "$APP" 2>&1 | grep -q "runtime"
            codesign -dv "$APP/Contents/MacOS/send_url_to_pid" 2>&1 | grep -q "runtime"
          fi

          if [ "$NOTARIZED" = "true" ]; then
            spctl --assess --type execute --verbose=4 "$APP"
            spctl --assess --type open --context context:primary-signature --verbose=4 "dist/$DMG_NAME"
          fi

          # Verify embedded Python backend runs cleanly directly from the read-only DMG mount
          (
            cd "$APP/Contents/Resources/app"
            VIBE_HUB_STATE_DIR="$TMP_STATE" VIBE_HUB_LOCAL_ONLY=1 \
              /usr/bin/python3 -B -m hub.server --port 18488 --local-only
          ) > "$TMP_STATE/srv.log" 2>&1 &
          SRV_PID=$!

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18488/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done

          curl -fsS http://127.0.0.1:18488/api/health | VERSION="$VERSION" /usr/bin/python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)
          assert d["ok"] is True, d
          assert d["port"] == 18488, d
          assert d["version"] == os.environ["VERSION"], d
          print("DMG read-only runtime verified:", d["version"], d["server"]["base_url"])
          '
          (cd dist && /usr/bin/shasum -a 256 -c "${DMG_NAME}.sha256")

      - name: Generate GitHub Release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
          NOTARIZED: ${{ steps.notary.outputs.notarized }}
        run: |
          EXTRA_FLAGS=()
          if [ "$NOTARIZED" = "true" ]; then
            EXTRA_FLAGS+=(--signed-notarized)
          fi
          /usr/bin/python3 scripts/extract_release_notes.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --changelog CHANGELOG.md \
            --dmg-name "$DMG_NAME" \
            --sha256-file "dist/${DMG_NAME}.sha256" \
            --output dist/release-notes.md \
            "${EXTRA_FLAGS[@]}"
          cat dist/release-notes.md

      - name: Publish GitHub Release with DMG installer & SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes and assets..."
            gh release upload "$TAG" \
              "dist/$DMG_NAME" \
              "dist/${DMG_NAME}.sha256" \
              --clobber
            gh release edit "$TAG" \
              --title "Vibe Session Hub $TAG" \
              --notes-file dist/release-notes.md
          else
            CREATE_FLAGS=(
              --title "Vibe Session Hub $TAG"
              --notes-file dist/release-notes.md
              --verify-tag
            )
            if [ "$PRERELEASE" = "true" ]; then
              CREATE_FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" \
              "dist/$DMG_NAME" \
              "dist/${DMG_NAME}.sha256" \
              "${CREATE_FLAGS[@]}"
          fi

      - name: Upload DMG build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibe-session-hub-${{ steps.meta.outputs.tag }}-macos-universal
          path: |
            dist/${{ steps.meta.outputs.dmg_name }}
            dist/${{ steps.meta.outputs.dmg_name }}.sha256
            dist/release-notes.md
          retention-days: 14

      - name: Clean up temporary signing keychain
        if: always() && steps.signing.outputs.keychain_path != ''
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || rm -f "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-result.json"
