changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: "✨ Features"
      labels:
        - enhancement
        - feature
    - title: "⚡ Performance & Sync"
      labels:
        - performance
        - sync
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "🧱 Architecture & Refactoring"
      labels:
        - refactor
        - architecture
    - title: "📦 CI/CD & Packaging"
      labels:
        - ci
        - release
        - packaging
    - title: "📝 Documentation"
      labels:
        - documentation
    - title: "Other Changes"
      labels:
        - "*"
